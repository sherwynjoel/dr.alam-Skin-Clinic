<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post | Dr. Alam's Skin Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        .post-hero { padding: 180px 0 100px; background: var(--color-primary-dark); color: white; text-align: center; }
        .post-content-section { padding: 80px 0; background: white; }
        .post-container { max-width: 800px; margin: 0 auto; line-height: 1.8; font-size: 1.15rem; color: #2d3436; }
        .post-container h2, .post-container h3 { color: var(--color-primary-dark); margin-top: 2.5rem; margin-bottom: 1rem; }
        .post-container p { margin-bottom: 1.5rem; }
        .post-category { display: inline-block; padding: 4px 12px; background: var(--color-accent); color: white; border-radius: 4px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 1rem; }
        #post-date { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-top: 1rem; display: block; }
        .post-loader { text-align: center; padding: 100px; font-style: italic; color: #666; }
    </style>
  <link rel="stylesheet" crossorigin href="/assets/components-D2OYa6gM.css">
</head>
<body>
    <header class="header">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-17826832618"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'AW-17826832618');
</script>
        <div class="container nav-container">
            <a href="/" class="logo">
                <img src="/assets/logo-Dm0W0hHt.png" alt="Dr. Alam's Logo" class="logo-icon">
                <div class="logo-text-wrapper">
                    <span class="logo-text">DR. ALAM'S SKIN CLINIC</span>
                    <span class="logo-subtext">Dermatology & Laser Surgery Centre</span>
                </div>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/services" class="nav-link">Services</a>
                <a href="/results" class="nav-link">Results</a>
                <a href="/blog" class="nav-link active">Blog</a>
                <a href="/contact" class="btn btn-primary">Contact</a>
            </nav>
        </div>
    </header>

    <main id="post-root">
        <div class="post-loader">Loading article...</div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Dr. Alam's Skin Clinic. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('post-root').innerHTML = '<div class="container" style="padding:100px;text-align:center;"><h2>Post not found.</h2><a href="/blog">Return to Blog</a></div>';
                return;
            }

            try {
                const res = await fetch('/data/blogs.json?v=' + Date.now());
                const blogs = await res.json();
                const post = blogs.find(b => b.id === postId);

                if (!post) {
                    document.getElementById('post-root').innerHTML = '<div class="container" style="padding:100px;text-align:center;"><h2>Post not found.</h2><a href="/blog">Return to Blog</a></div>';
                    return;
                }

                document.title = post.title + " | Dr. Alam's Skin Clinic";
                
                document.getElementById('post-root').innerHTML = `
                    <section class="post-hero">
                        <div class="container">
                            <span class="post-category">${post.category}</span>
                            <h1 style="font-size: clamp(2.5rem, 5vw, 4rem);">${post.title}</h1>
                            <span id="post-date">Published on ${post.date || 'Recent'}</span>
                        </div>
                    </section>
                    <section class="post-content-section">
                        <div class="container post-container">
                            ${post.content || '<p>No content available for this post.</p>'}
                            <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #eee;">
                                <a href="/blog" class="btn btn-outline-primary" style="text-decoration:none; color: var(--color-accent); font-weight:700;">← Back to All Articles</a>
                            </div>
                        </div>
                    </section>
                `;
            } catch (err) {
                console.error('Error loading post:', err);
                document.getElementById('post-root').innerHTML = '<div class="container" style="padding:100px;text-align:center;"><h2>Error loading post.</h2></div>';
            }
        });
    </script>
</body>
</html>
